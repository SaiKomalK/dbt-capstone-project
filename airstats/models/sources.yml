sources:
  - name: airstats
    database: airstats
    schema: raw
    tables:
      - name: airports
        identifier: airports
        description: Global airport data (~72K rows)
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

          - name: type
            data_tests:
              - not_null

          - name: name
            data_tests:
              - not_null

          - name: iso_country
            data_tests:
              - not_null

      - name: comments
        identifier: airport_comments
        description: User comments about airports
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          
          - name: airport_ref
            data_tests:
              - not_null

          - name: date
            data_tests:
              - not_null

      - name: runways
        identifier: runways
        description: Runway information (~44K rows)
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          
          - name: airport_ref
            data_tests:
              - not_null

          - name: closed
            data_tests:
              - not_null